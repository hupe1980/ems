[package]
name        = "tariffd"
description = "Day-ahead electricity price ingestion and caching for EMS gateways"
publish     = false
version.workspace      = true
authors.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
rust-version.workspace = true

[dependencies]
ems-core    = { workspace = true }
ems-grid    = { workspace = true, features = ["serde"] }
ems-service = { workspace = true }
http          = { workspace = true }
rmcp         = { workspace = true }
schemars     = { workspace = true }
tokio-util   = { workspace = true }
ems-tariff  = { workspace = true, features = ["serde"] }

anyhow       = { workspace = true }
axum         = { workspace = true }
clap         = { version = "4", features = ["derive", "env"] }
reqwest      = { workspace = true }
rust_decimal = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
thiserror    = { workspace = true }
time         = { workspace = true }
tokio        = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time", "net", "sync"] }
tracing      = { workspace = true }

[dev-dependencies]
toml = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync"] }
