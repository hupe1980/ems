[package]
name = "cemsd"
description = "Industrial shift peaks and interval metering"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
openadr = ["dep:openadr", "dep:rust_decimal", "dep:reqwest", "dep:uuid"]

[dependencies]
ems-core = { workspace = true }
ems-sim = { workspace = true, features = ["peak"] }
openadr = { workspace = true, features = ["vtn"], optional = true }
reqwest = { workspace = true, features = ["query"], optional = true }
uuid = { workspace = true, optional = true }
anyhow = { workspace = true }
axum = { workspace = true }
clap = { version = "4", features = ["derive"] }
ems-service = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "net"] }
serde_json = { workspace = true }
time = { workspace = true }
rust_decimal = { version = "1", optional = true }
