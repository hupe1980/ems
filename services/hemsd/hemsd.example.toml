# Household gateway configuration. Replace example addresses and assets for your site.
# Validate with: hemsd run --check --config /etc/hems/hemsd.toml
# Supported EMS_HEMSD_* environment overrides take precedence.

# This installation enforces limits and may send device setpoints.
mode = "managed"
# For an observing gateway select "shadow" and identify its independent controller.
# external_limit_controller = "Building controller A"

# Embedded evidence, registers, outbox and learned state.
store_path = "/var/lib/hemsd/hemsd.redb"

# Local measurement history: observations for keep_days, quarter-hour mean, range and count for three years.
# Omit [series] to disable /v1/series.
[series]
path = "/var/lib/hemsd/series"
keep_days = 7

# ── The shell ────────────────────────────────────────────────────────────────
[service]
# Use loopback for local access. Configure HTTPS for a LAN listener.
listen = "127.0.0.1:8080"
log_filter = "info"
log_json = false
shutdown_grace_s = 20

# ── How fast the planes run ──────────────────────────────────────────────────
[control]
# Guard and arbiter interval. Longer ticks reduce usable PV feed-in headroom.
tick_period_s = 1
# Seconds between planning runs.
replan_every_s = 300
# Planning horizon in quarter-hours. 192 covers two days.
horizon_slots = 192
# Solver time limit in seconds. Zero disables the limit.
solve_budget_s = 10.0

# Forecast policy: median, expected, hedged or pessimistic. Expected and hedged
# evaluate multiple scenarios and take longer to solve.
risk = "median"

# Optional prices added to the cost objective. Zero disables each preference.
[control.preferences]
# Carbon price in €/kg. A time-varying carbon intensity enables shifting between hours.
co2_eur_per_kg = 0.0
# Extra cost assigned to each imported kWh.
autarky_eur_per_kwh = 0.0

# ── The house ────────────────────────────────────────────────────────────────
#
# Set the capacity of an absent asset to zero. A driver referring to it fails validation.
[site]
pv_kwp = 9.8
pv_ac_kw = 8.0

# Tilt: 0° flat, 90° vertical. Azimuth clockwise from north: 90° east, 180° south.
# For split arrays, enter the orientation with the larger installed capacity.
pv_tilt_deg = 35.0
pv_azimuth_deg = 180.0

battery_kwh = 10.0
battery_kw = 5.0
# Fraction of battery capacity reserved for a power cut.
reserve_soc = 0.1
# Battery wear in euros per kWh of throughput.
battery_wear_eur_per_kwh = 0.08
fuse_a = 35.0

# Optional contractual connection limit in kW. Applies to the guard, planner and EEBUS.
# contract_power_kw = 30.0

# Market location, metering location, operator and grid area. MaLo-ID includes a check digit.
# malo = "41373559241"
# melo = "DE0001234567890000000000000123456"
# dso_code = "9903386000006"
# netzbereich = "NB-0001"

# Federal state used for public holidays in the load profile.
bundesland = "BE"
# Annual household consumption excluding the heat pump, EV and battery, used to scale the initial load profile.
# household_kwh_per_year = 3500

latitude = 52.52
longitude = 13.4
altitude_m = 34.0

heat_pump_kw = 5.0
heat_pump_rod_kw = 3.0
heat_pump_modulating = true
# Set a consumption ceiling, select an SG Ready or vendor operating state,
# or use "compressor" with an EEBUS OHPCF driver. SG Ready boost raises
# the thermostat target. The appliance decides when to draw power.
# heat_pump_cooling_kw = 4.0  # for an installed reversible unit with a direction control
heat_pump_control = "power-ceiling"
# Indoor comfort band used for planning when a driver reports room temperature.
comfort_min_c = 20.0
comfort_max_c = 23.0

dhw_litres = 300.0
dhw_heater_kw = 0.5
# Heat delivered per kWh of electricity. Use 1.0 for an immersion heater.
dhw_cop = 3.0
# Tank heat loss at rest, in watts.
dhw_standing_loss_w = 45.0
# Minimum service temperature, ordinary thermostat setting and safe upper bound, in °C.
# The unmanaged comparison uses the ordinary thermostat setting.
dhw_t_min_c = 45.0
dhw_t_set_c = 55.0
dhw_t_max_c = 60.0

# Maximum amperes per phase. Set to zero for a site without a wallbox.
evse_max_a = 16.0
# Enable only if the installed wallbox supports phase switching.
evse_switchable = true
# Enable if the installation supports vehicle-to-home discharge.
evse_bidirectional = false
ev_charge_limit = 0.75

# Average kW in each consecutive quarter of one dishwasher cycle. Use [] for no cycle.
dishwasher_kw_steps = [2.0, 0.2, 0.2, 0.2, 1.8, 0.1]

# PV feed-in rules use the commissioning date in [site.declared.pv].
[site.para9]
# Set true after the network operator’s first successful controllability test (§ 9 Abs. 2 EEG).
imsys_control_device = false
# Date the intelligent metering system was installed. Omit if none is installed.
imsys_since = "2024-06-01"
# § 9 Abs. 2 S. 4: a Steckersolargerät within **both** size tests — 2 kW DC and
# 800 W AC — is outside the cap altogether.
steckersolargeraet = false
# § 100 Abs. 3 S. 2 Nr. 2: a system commissioned before 2023 that met its
# obligation by limiting itself to 70 % rather than by accepting a
# Rundsteuerempfänger. Leave it false for anything newer.
legacy_70_percent = false

# Initial thermal model until measurements support a fitted one.
# Classes: average, new-build, solid-wall and apartment.
[site.building]
class = "average"
# Orientation of the main glazed façade, clockwise from north.
facade_azimuth_deg = 180.0
# Any of the six parameters may be given instead, and overrides the class.
# `r_air_out_k_per_kw` is ΔT / Q at the design pair: a house losing 6,8 kW at
# 21 °C indoors and −20 °C outdoors is 41 / 6,8 = 6.
# air_capacity_kwh_per_k = 0.6
# mass_capacity_kwh_per_k = 12.0
# r_air_out_k_per_kw = 6.0
# r_air_mass_k_per_kw = 0.4
#
# Effective glazed area (m²) and indoor heat gains (kW).
# solar_aperture_m2 = 4.5
# internal_gain_kw = 0.45

# Use the commissioning records for each installed asset. The gateway uses these
# declarations to determine § 14a participation and § 9 feed-in limits.
[site.declared.pv]
commissioned = "2025-03-01"

[site.declared.battery]
commissioned = "2025-03-01"

[site.declared.wallbox]
commissioned = "2025-03-01"

[site.declared.waermepumpe]
commissioned = "2025-03-01"
# What it brings from before 2024 [A1 10]: "none", "reduced_network_fee" (the
# old § 14a Abs. 2 S. 1 reduced network fee, which runs to 31.12.2028) or
# "nachtspeicher" (a night-storage heater, [A1 10.2.b], indefinitely).
legacy_status = "none"
# [A1 10.4]: the operator moved this device into the netzorientierte Steuerung
# voluntarily. Irreversible, and the operator may not refuse.
switched_voluntarily = false
# Why it is not a steuerbare Verbrauchseinrichtung at all [A1 3.1.b]:
# "public_charge_point", "emergency_services" or
# "non_residential_heating_or_cooling". The list is closed; anything not on it
# participates.
# exemption = "non_residential_heating_or_cooling"

[site.declared.warmwasser]
commissioned = "2025-03-01"

[site.declared.spuelmaschine]
commissioned = "2025-03-01"

# Import price components use net ct/kWh. The tariff calculation adds levies and VAT.
[tariff]
# Supplier markup on the wholesale import price.
markup_ct_per_kwh = 3.0
# Wholesale price used for intervals without an auction price.
fallback_ct_per_kwh = 20.0
# For a fixed import price, set this field instead of fetching a day-ahead curve.
# fixed_ct_per_kwh = 28.5

network_ct_per_kwh = 10.0
# "none", "modul1", "modul2" or "modul3".
modul = "modul1"
modul_1_reduction_eur_per_year = 120.0
feed_in_ct_per_kwh = 7.86
standing_charge_eur_per_year = 120.0

# Optional overrides for the annual levy defaults. Use the supplier’s price sheet.
# [tariff.levies]
# konzessionsabgabe = 1.32          # § 2 KAV: 1.32, 1.59, 1.99 or 2.39
# kwkg = 0.446
# paragraph_19_strom_nev = 1.559
# offshore = 0.941
# stromsteuer = 2.05
# vat_rate = 0.19

# For Modul 3, set modul = "modul3" above and enter the operator’s published calendar below.
# [tariff.modul3]
# id = "NB-14A-3-2026"
# year = 2026
# # Minutes of the local day. At least two hours of Hochtarif on every day class
# # the definition distinguishes; the Niedertarif band may wrap past midnight.
# hochtarif_minutes  = [1020, 1200]   # 17:00–20:00
# niedertarif_minutes = [1320, 360]   # 22:00–06:00
# # The operator's Wahlrecht, published on the price sheet. At least two.
# billed_quarters = ["Q1", "Q4"]
# # The operator's own three working prices, ct/kWh.
# ht_ct_per_kwh = 18.0
# st_ct_per_kwh = 10.0
# nt_ct_per_kwh = 4.0
# # Source of the network operator’s published prices.
# source = "https://www.example-netz.de/preisblatt-2026.pdf#modul3"

# ── Where the box asks for prices and weather ────────────────────────────────
#
# Optional forecast and tariff services. Check /v1/status for planner availability.
[fleet]
tariffd_url = "https://tariffd.internal:7380"
forecastd_url = "https://forecastd.internal:7280"
# Location identifier configured in forecastd for this site.
location = "berlin"
request_timeout_s = 10

# ── Where the box forwards its own record ────────────────────────────────────
#
# Grid-control evidence is recorded locally before delivery. Pending batches remain in the outbox.
[histd]
url = "https://histd.internal:7580"
site = "reference-household"
# Reference a credential provisioned outside this file.
token = "env:EMS_HISTD_TOKEN"
# Seconds between outbox deliveries.
every_s = 300
# Maximum records sent per batch after an outage.
batch = 50

# Signed household reports. The outbox retains pending deliveries and signs each retry.
[obsd]
url = "https://obsd.internal:7780"
# Webhook signing secret shared with obsd.
# Same whsec_<standard Base64> value configured for this site on the collector.
secret = "env:EMS_OBSD_SECRET"

# The gateway listens for the Steuerbox. Give the metering operator the gateway SKI
# from /v1/status and retain store_path to preserve that identity.
[ship]
listen = "0.0.0.0:4712"
# SHIP identifier advertised by the gateway.
ship_id = "hems_hems-1"
# Trusted peer SKIs, in addition to pairings saved in the gateway store.
trust = []
# Advertise the gateway on the local network with _ship._tcp.
announce = true

# Omit token to use the access code issued by the gateway. For a provisioned
# credential, use an env: or file: reference. Issue manager credentials via /v1/managers.
[api]
# token = "env:HEMS_API_TOKEN"

# ── Being managed by somebody else's energy manager ──────────────────────────
#
# A delegated manager connects to wss://<box>/s2/<asset> on the service port.
# Its instructions take precedence over the local plan. Household overrides
# and the guard still apply. [A1 4.6 S. 3]
[s2]
enabled = false
# Seconds until a stale manager instruction expires and local planning resumes.
instruction_for_secs = 900
# Seconds between measurement reports to the connected manager.
report_every_secs = 5

# ── What speaks to the hardware ──────────────────────────────────────────────
#
# Each entry names an asset declared in [site]. When an asset has multiple
# drivers, use a single source for each control or measurement capability.
# For example, an EV session observer can accompany the wallbox actuator.

# The inverter, over SunSpec on Modbus TCP.
[[drivers]]
kind = "sunspec"
asset = "pv"
address = "192.0.2.10:502"
unit = 1
poll_ms = 1000
# Shorter than the guard's own `max_measurement_age`, or a device could be
# silent for a whole control period while the guard still called its last
# reading fresh.
timeout_ms = 5000
listens_only = false
# SunSpec model 123 expresses a production ceiling as a percentage of the
# rating, so a curtailment cannot be expressed at all without one.
rating_kw = 8.0

# Read-only meter at the grid connection, including uninstrumented household loads.
[[drivers]]
kind = "sunspec"
asset = "netzanschluss-zaehler"
address = "192.0.2.11:502"
unit = 1
listens_only = true

# For a SunSpec model 203 meter on RS-485, replace the grid meter above with:
# [serial_buses.cabinet]
# path = "/dev/serial/by-id/usb-grid-meter-adapter"
# baud = 19200
# parity = "even"
# stop_bits = 1
#
# [[drivers]]
# kind = "serial-sunspec"
# asset = "netzanschluss-zaehler"
# bus = "cabinet"
# unit = 7

# Optional household goal for a wallbox with vehicle telemetry.
# [charging]
# departure = "07:00"
# target_soc = 0.80

# Read vehicle presence and charge over EEBUS EVCC and EVSOC. Pin the peer SKI.
# Set the departure time and target charge for the household.
# [[drivers]]
# kind = "eebus-ev"
# asset = "wallbox"
# address = "192.168.1.50:4712"
# ski = "0000000000000000000000000000000000000000"
# departure = "07:00"
# target_soc = 0.8

# Read tank temperature (MDT) and request a one-time load (CDSF) over the same SHIP session.
# [[drivers]]
# kind = "eebus-dhw"
# asset = "warmwasser"
# address = "192.168.1.40:4712"
# ski = "0000000000000000000000000000000000000000"

# Vendor-specific Modbus map. Use the manufacturer’s addresses for the exact
# model. Read points cannot issue commands. Declare permitted writes separately.
#
# For each point, choose "holding" (default) or "input", a word format
# (u16, s16, u32, s32, u32_swapped, s32_swapped), and a scale that converts
# the raw value to watts, °C or state-of-charge fraction. Power is positive
# into the asset. A read-only map can accompany a separate actuator, provided
# the two drivers do not both claim the measurement role.
#
# [[drivers]]
# kind = "registers"
# asset = "waermepumpe"
# address = "192.0.2.30:502"
# unit = 1
# poll_ms = 1000
# timeout_ms = 5000
# points = [
#   { space = "input", register = 507, word = "s16", scale = 0.1, field = "temperature_c" },
#   { register = 2240, word = "u32", field = "power" },
# ]
# # Optional thermal-mode command. Use the holding register and the exact
# # 16-bit raw values specified by the manufacturer for heating and cooling.
# writes = [
#   { command = "thermal_mode", register = 1501, heat = 1, cool = 2 },
# ]

# Optional EEBUS heat pump. OHPCF controls the compressor, MRT reports room
# temperatures and MOT reports outdoor temperature. Set heat_pump_control =
# "compressor" under [site] to enable compressor commands.

# [[drivers]]
# kind = "eebus-heat-pump"
# asset = "waermepumpe"
# address = "192.168.1.60:4712"
# ski = "0000000000000000000000000000000000000000"

# The Steuerbox connects to the listener configured in [ship].
[[drivers]]
kind = "eebus-lpc"
asset = "netzanschluss"
# Omit failsafe_kw to derive the site minimum from its controllable devices [A1 4.5.2].
failsafe_hours = 2
spine_vendor = "n:hems"
spine_unique = "hems-1"

# Outbound TLS uses platform roots by default. A pinned bundle replaces them.
# [service.http]
# timeout_s = 30
#
# [service.http.tls_roots]
# from = "pinned"
# bundle = "/etc/hems/fleet-ca.pem"

# Read one commissioned appliance in Setup (build hemsd with --features matter).
# Use hexadecimal fabric and node IDs. Test with: hemsd matter-read --config PATH
# [matter]
# name = "Washing machine"
# fabric = "beef"
# node = "a"
# endpoint = 2
# port = 5580

# Optional dedicated wired heat-meter converter (8E1).
# [heat_meter]
# path = "/dev/serial/by-id/usb-mbus-converter"
# address = 17
# manufacturer = "KAM"
# meter_id = "06855817"
# baud = 2400
# poll_s = 60
