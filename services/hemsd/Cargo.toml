[package]
name        = "hemsd"
description = "Household energy gateway with local control, planning and a browser interface"
publish     = false
version.workspace      = true
authors.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
rust-version.workspace = true

[[bin]]
name = "hemsd"
path = "src/main.rs"

[lib]
name = "hemsd"
path = "src/lib.rs"

[dependencies]
ems-device = { workspace = true, optional = true }
uuid = { workspace = true }
tokio-tungstenite = { version = "0.29", optional = true, default-features = false, features = ["connect"] }
futures-util = { version = "0.3", optional = true, features = ["sink"] }
ems-core      = { workspace = true }
ems-drv       = { workspace = true, features = ["eebus", "modbus", "mbus"] }
ems-events    = { workspace = true }
ems-flex      = { workspace = true }
ems-forecast  = { workspace = true }
ems-grid      = { workspace = true }
# The gateway uses HiGHS for its rolling household plan.
ems-optimizer = { workspace = true, features = ["highs"] }
ems-realtime  = { workspace = true }
ems-service   = { workspace = true, features = ["tls"] }

# SHIP transport and mutual TLS run in the daemon. The conformance harness exercises the device procedures.
eebus        = { workspace = true, features = ["runtime", "mdns", "aws-lc-rs", "conformance"] }
if-addrs     = { workspace = true }
ems-sim       = { workspace = true }
# Axum accepts S2 manager connections and routes them by resource.
s2-kit       = { workspace = true }
ems-tariff    = { workspace = true }
metering       = { workspace = true }

anyhow       = { workspace = true }
axum         = { workspace = true, features = ["ws"] }
clap         = { version = "4", features = ["derive", "env"] }
reqwest      = { workspace = true }
# redb holds evidence and the outbox. Chronix stores sampled power history.
redb         = { workspace = true }
chronix      = { workspace = true }
arrow        = { workspace = true }
rust_decimal = { workspace = true }
getrandom    = { workspace = true }
hex          = { workspace = true }
rustls       = { workspace = true }
# Web Push (runtime::webpush): message encryption [RFC 8291] and the VAPID
# signature [RFC 8292], on the provider above; base64url is their one spelling.
aws-lc-rs    = { workspace = true }
base64       = { workspace = true }
rcgen        = { workspace = true }
# The handover sheet's QR codes, as SVG (runtime::handover).
qrcode       = { workspace = true }
serde        = { workspace = true }
schemars     = { workspace = true }
serde_json   = { workspace = true }
thiserror    = { workspace = true }
toml         = { workspace = true }
tokio        = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util"] }
time         = { workspace = true }
tokio-serial = { version = "5.5", default-features = false }
tracing      = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Loopback charging and metering peers for the house feature.
ocpp-kit = { workspace = true, features = ["tokio"], optional = true }
tokio-modbus = { workspace = true, optional = true }
tempfile = { version = "3", optional = true }
sunspec      = { workspace = true, optional = true }

[features]
matter = ["ems-drv/matter", "dep:tokio-tungstenite", "dep:futures-util"]
# `hemsd house`: a simulated household on the wire — SunSpec devices over Modbus
# TCP and a Steuerbox over SHIP — for a real `hemsd run` to manage.
house = ["dep:ems-device", "tokio/process", "dep:futures-util", "dep:tokio-tungstenite", "dep:ocpp-kit", "ems-drv/ocpp", "dep:tokio-modbus", "dep:sunspec", "dep:tempfile"]

[dev-dependencies]
# Independent RTU meter for the pseudo-terminal integration test.
tokio-modbus = { workspace = true, features = ["rtu-server"] }
# Exercise the inbound manager route with the S2 reference client.
s2-kit   = { workspace = true, features = ["tokio"] }

[[example]]
name = "serial_meter"
required-features = ["house"]
