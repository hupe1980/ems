# Fleet enrolment and signed manifests. Run: fleetd --config /etc/hems/fleetd.toml
# Supported EMS_FLEETD_* environment overrides take precedence.

# MCP configuration-report silence threshold. The operator desk measures periodic check-ins separately.
silent_after_s = 3600

[service]
listen = "0.0.0.0:7180"
log_filter = "info"
log_json = true
shutdown_grace_s = 20

# Use a shared PostgreSQL database so enrolment secrets are single-use across replicas.
[database]
url = "env:EMS_FLEETD_DATABASE_URL"
pool_size = 10
acquire_timeout_s = 5
statement_timeout_s = 30
tls = true

# Declare the configuration and version offered to each enrolled site.
[sites."reference-household"]
# Provision once during installation.
enrolment_secret = "env:EMS_FLEETD_SECRET_REFERENCE_HOUSEHOLD"
# The configuration document the box should be running, and the version it
# reports back on. Convergence is what the box *says*, never what was pushed.
config         = "{}"
config_version = "1"
# Replace the placeholder with the external signer’s hexadecimal Ed25519 signature.
config_signature = "3045022100c0ffee…"

# Publish an externally signed manifest per component.
# [releases.hemsd]
# version   = "0.2.0"
# url       = "https://releases.example.com/hemsd-0.2.0.tar.gz"
# sha256    = "…"
# signature = "…"

# Scope each operator to a tenant. "*" grants fleet-wide access.
[[operators]]
token  = "env:EMS_FLEETD_OPERATOR_TOKEN"
tenant = "*"

# [tenants]
# stadtwerke-nord = ["reference-household"]

[mcp]
enabled = false
