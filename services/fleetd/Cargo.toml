[package]
name        = "fleetd"
description = "Gateway enrolment, versioned configuration and signed release distribution"
publish     = false
version.workspace      = true
authors.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
rust-version.workspace = true

[dependencies]
tokio-postgres    = { workspace = true }
deadpool-postgres = { workspace = true }
ems-service = { workspace = true, features = ["postgres"] }
# The Model Context Protocol surface at `/mcp`, on the socket this daemon
# already binds. Read-only tools: an agent may read what an operator reads and
# may move nothing.
http           = { workspace = true }
rmcp          = { workspace = true }
schemars      = { workspace = true }
tokio-util    = { workspace = true }

anyhow        = { workspace = true }
axum          = { workspace = true }
clap          = { version = "4", features = ["derive", "env"] }
ed25519-dalek = { workspace = true }
getrandom     = { workspace = true }
hex           = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
sha2          = { workspace = true }
thiserror     = { workspace = true }
time          = { workspace = true }
tokio         = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time", "net", "sync"] }
toml          = { workspace = true }
tracing       = { workspace = true }

[dev-dependencies]
ems-service = { workspace = true, features = ["testkit"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "sync", "io-util"] }
