[workspace]
resolver = "3"
members = ["crates/ems-core", "crates/ems-device", "crates/ems-drv", "crates/ems-flex", "crates/ems-grid", "crates/ems-realtime", "crates/ems-tariff", "crates/ems-forecast", "crates/ems-optimizer", "crates/ems-events", "crates/ems-service", "crates/ems-sim", "services/agentd", "services/fleetd", "services/forecastd", "services/hemsd", "services/bemsd", "services/cemsd", "services/histd", "services/obsd", "services/tariffd", "tools/ems-wasm", "xtask"]

[workspace.package]
version      = "0.8.0"
authors      = ["hupe1980"]
edition      = "2024"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/hupe1980/ems"
homepage     = "https://hupe1980.github.io/ems"
rust-version = "1.99"

[workspace.dependencies]
openadr = { version = "=0.6.0", default-features = false }
matter-kit = { version = "0.4", default-features = false }
ocpp-kit = { version = "0.8", default-features = false, features = ["v1_6"] }
# ── External ────────────────────────────────────────────────────────────────
thiserror    = "2"
serde        = { version = "1", features = ["derive"] }
# Preserve f64 values across serialized forecasts and persisted controller state.
serde_json   = { version = "1", features = ["float_roundtrip"] }
time         = { version = "0.3", features = ["std", "macros", "parsing", "formatting", "serde-well-known"] }
# Use PostgreSQL NUMERIC for exact settlement quantities.
rust_decimal = { version = "1", features = ["macros", "db-tokio-postgres"] }
uuid         = { version = "1", features = ["v4", "v7", "serde"] }
tracing      = "0.1"
# Rust-defined fleet specialists use the embedded redb journal.
agentplane   = { version = "0.61", default-features = false, features = ["redb"] }
anyhow       = "1"
toml         = { version = "1", default-features = false, features = ["parse", "serde"] }

# Parse market feeds in ems-tariff. Fetching belongs to tariffd.
quick-xml    = { version = "0.42", default-features = false }

# Berlin settlement calendar, OBIS identifiers and metering rules.
metering     = { version = "0.26", features = ["serde"] }

# Keep transport and TLS in the edge daemon.
eebus        = { version = "0.13.1", default-features = false, features = ["std"] }

# Use the sans-I/O session engines and the workspace time types. Default TLS features pull in ring.
s2-kit       = { version = "0.4", default-features = false, features = ["std", "time", "uuid"] }
# Select local interfaces for mDNS announcements.
if-addrs     = { version = "0.15" }

# Decode the supported SunSpec register models without a networking client.
sunspec      = { version = "0.9", default-features = false, features = [
    "model1", "model101", "model102", "model103", "model123",
    "model201", "model202", "model203", "model204",
    "model701", "model702", "model802",
] }

# Server for the virtual household behind the hemsd house feature.
tokio-modbus = { version = "0.17", default-features = false, features = ["tcp-server"] }

# microlp is the default pure-Rust solver.
good_lp      = { version = "1.15", default-features = false }

# ── Internal (path + version so the domain crates can be published) ─────────
ems-core      = { path = "crates/ems-core",      version = "0.8" }
ems-device    = { path = "crates/ems-device",    version = "0.8" }
ems-drv       = { path = "crates/ems-drv",       version = "0.8" }
ems-flex      = { path = "crates/ems-flex",      version = "0.8" }
ems-grid      = { path = "crates/ems-grid",      version = "0.8" }
ems-tariff    = { path = "crates/ems-tariff",    version = "0.8" }
ems-forecast  = { path = "crates/ems-forecast",  version = "0.8" }
ems-optimizer = { path = "crates/ems-optimizer", version = "0.8" }
ems-realtime  = { path = "crates/ems-realtime",  version = "0.8" }
ems-events    = { path = "crates/ems-events",    version = "0.8" }
ems-service   = { path = "crates/ems-service",   version = "0.8" }
ems-sim       = { path = "crates/ems-sim",       version = "0.8" }

# Shared runtime dependencies

# Each daemon enables its required runtime features.
tokio        = { version = "1", default-features = false }
# matched-path labels metrics by route template.
axum         = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "matched-path"] }
# Use rustls with the workspace crypto provider. Deployment-specific trust roots live in TlsRoots.
reqwest      = { version = "0.13", default-features = false, features = ["rustls", "http2", "json", "charset"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "json", "std", "ansi"] }
# Fleet daemons expose read-only MCP tools.
rmcp         = { version = "3", default-features = false, features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
schemars     = { version = "1", default-features = false, features = ["derive"] }
tokio-util   = { version = "0.7", default-features = false }
# Household evidence and its outbox entry share one transaction.
redb         = { version = "4" }
# Local measurement series and rollups. SQL and analytics are optional upstream features.
chronix      = { version = "0.10", default-features = false }
# Match the Arrow major returned by chronix and read timestamps as integers.
arrow        = { version = "59", default-features = false }
# Fleet persistence uses PostgreSQL NUMERIC and TIMESTAMPTZ.
tokio-postgres        = { version = "0.7", features = ["with-time-0_3", "with-serde_json-1"] }
tokio-postgres-rustls = { version = "0.14" }
deadpool-postgres     = { version = "0.14", default-features = false, features = ["rt_tokio_1"] }
# Keep aws-lc-rs as the single TLS provider.
rustls                = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12", "logging"] }
# CA roots for managed PostgreSQL connections.
webpki-roots          = { version = "1" }
# TLS server for the household API.
tokio-rustls          = { version = "0.26", default-features = false, features = ["tls12", "aws_lc_rs"] }
hyper-util            = { version = "0.1", default-features = false, features = ["server-auto", "service", "tokio"] }
# Web Push encryption uses the same provider as rustls.
aws-lc-rs             = { version = "1", default-features = false, features = ["aws-lc-sys"] }
rcgen                 = { version = "0.14", default-features = false, features = ["pem", "aws_lc_rs"] }
# Render handover codes as SVG without raster codecs.
qrcode                = { version = "0.15", default-features = false, features = ["std", "svg"] }
# Verify signatures on configuration and release manifests.
ed25519-dalek = { version = "3", default-features = false, features = ["alloc", "fast", "zeroize"] }
sha2          = { version = "0.11", default-features = false, features = ["alloc"] }
http         = "1"
hex           = { version = "0.4", default-features = false, features = ["std"] }
# Authenticate box-to-fleet messages with Standard Webhooks.
hmac          = { version = "0.13", default-features = false }
base64        = { version = "0.23", default-features = false, features = ["std"] }
# Generate credentials from operating-system entropy.
getrandom     = { version = "0.4", default-features = false, features = ["std"] }

# Optimize solver dependencies in debug builds.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = "debuginfo"
