[package]
name        = "ems-realtime"
description = "Local grid-limit enforcement, device allocation and command arbitration"
keywords    = ["energy", "hems", "control", "smart-grid", "load-management"]
categories  = ["science", "simulation"]
readme      = "README.md"
version.workspace      = true
authors.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
rust-version.workspace = true

[dependencies]
ems-core   = { workspace = true }
ems-device = { workspace = true }
ems-grid   = { workspace = true }
serde     = { workspace = true, optional = true }
time      = { workspace = true }

[features]
default = ["serde"]
## Serialize/deserialize every public type.
serde = ["dep:serde", "ems-core/serde", "ems-device/serde", "ems-grid/serde"]
