[package]
name        = "ems-core"
description = "Energy units, assets, circuits, measurements and quarter-hour time slots for energy management"
keywords    = ["energy", "hems", "photovoltaic", "smart-grid", "battery"]
categories  = ["science", "simulation"]
readme      = "README.md"
version.workspace      = true
authors.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
rust-version.workspace = true

[dependencies]
metering     = { workspace = true }
serde        = { workspace = true, optional = true }
thiserror    = { workspace = true }
time         = { workspace = true }
uuid         = { workspace = true }

[features]
default = ["serde"]
## Serialize/deserialize every public type.
serde = ["dep:serde", "metering/serde", "uuid/serde", "time/serde-well-known"]

[dev-dependencies]
serde_json = { workspace = true }
