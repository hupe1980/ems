[package]
name        = "ems-drv"
description = "Protocol adapters for energy devices and grid controls"
keywords    = ["energy", "hems", "eebus", "sunspec", "modbus"]
categories  = ["science", "hardware-support"]
readme      = "README.md"
version.workspace      = true
authors.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
rust-version.workspace = true

[dependencies]
mbus-kit = { workspace = true, optional = true }
rust_decimal = { workspace = true, optional = true }
matter-kit = { workspace = true, optional = true }
ocpp-kit = { workspace = true, optional = true }
ems-core = { workspace = true }
serde     = { workspace = true, optional = true }
thiserror = { workspace = true }
time      = { workspace = true }

# The protocol crates, each behind the feature that needs it. A box that speaks
# only Modbus never compiles, audits or ships the EEBUS stack.
eebus     = { workspace = true, optional = true }
ems-grid = { workspace = true, optional = true }
sunspec   = { workspace = true, optional = true }
# SPINE datagrams travel as JSON inside a SHIP data frame, so the driver that
# takes and gives them needs exactly one thing of the wire format: `serde_json`.
serde_json = { workspace = true, optional = true }

[features]
## Wired M-Bus heat-meter readout.
mbus = ["dep:mbus-kit", "dep:rust_decimal"]
## Matter Electrical Power Measurement attributes.
matter = ["dep:matter-kit"]
## Read-only OCPP 1.6J metering and profile acknowledgements.
ocpp = ["dep:ocpp-kit"]
default = ["serde"]
## Serialize/deserialize every public type.
serde = ["dep:serde", "ems-core/serde"]
## EEBUS: the Controllable System of LPC/LPP — the § 14a side of a household.
eebus = ["dep:eebus", "dep:ems-grid", "dep:serde_json"]
## Modbus TCP device drivers and read-only RTU meter framing.
modbus = ["dep:sunspec"]

[dev-dependencies]
# The integration test drives both ends of a SPINE exchange and moves the
# datagrams between them as the bytes a SHIP data frame carries, which is the
# seam `hemsd` owns. It needs the encoder unconditionally, where the library
# needs it only with `eebus`.
serde_json = { workspace = true }
# The simulated Steuerbox, so the ways an operator's box goes wrong are driven
# against the machine a real box runs rather than against a second one written
# to be driven by it (D186). A dev-dependency and acyclic: `ems-sim` knows
# nothing about drivers, which is what lets it simulate the other side.
ems-sim   = { workspace = true }
