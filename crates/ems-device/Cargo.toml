[package]
name        = "ems-device"
description = "Convert energy setpoints into feasible commands for EV chargers, heat pumps and inverters"
keywords    = ["energy", "hems", "sg-ready", "device", "control"]
categories  = ["science", "hardware-support"]
readme      = "README.md"
version.workspace      = true
authors.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
rust-version.workspace = true

[dependencies]
ems-core = { workspace = true }
serde     = { workspace = true, optional = true }

[features]
default = ["serde"]
## Serialize/deserialize every public type.
serde = ["dep:serde", "ems-core/serde"]
