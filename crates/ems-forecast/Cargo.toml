[package]
name        = "ems-forecast"
description = "Photovoltaic and demand forecasts with uncertainty estimates for household energy planning"
keywords    = ["energy", "forecasting", "photovoltaic", "solar", "quantile"]
categories  = ["science", "simulation"]
readme      = "README.md"
version.workspace      = true
authors.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
rust-version.workspace = true

[dependencies]
ems-core = { workspace = true }
serde     = { workspace = true, optional = true }
# Reading somebody else's weather model. A pure parser — a `&str` in, a series
# out — so `ems-forecast` stays a domain crate that does no I/O: the fetching
# lives in `forecastd`, and the parser is tested against a captured body.
serde_json = { workspace = true }
thiserror  = { workspace = true }
time      = { workspace = true }

[features]
default = ["serde"]
## Serialize/deserialize every public type.
serde = ["dep:serde", "ems-core/serde"]
