[package]
name        = "ems-sim"
description = "Deterministic household device, weather and industrial peak-demand simulations"
keywords    = ["energy", "simulation", "hems", "testing"]
categories  = ["simulation", "development-tools::testing"]
readme      = "README.md"
version.workspace      = true
authors.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
rust-version.workspace = true

[[example]]
name = "peak_receipts"
required-features = ["peak"]

[dependencies]
anyhow = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
rust_decimal = { version = "1", optional = true }
ems-core     = { workspace = true }
serde         = { workspace = true, optional = true }
time          = { workspace = true }

[features]
## Industrial quarter-hour demand replay and register reconciliation.
peak = ["serde", "dep:anyhow", "dep:serde_json", "dep:rust_decimal"]
default = ["serde"]
## Serialize/deserialize every public type.
serde = ["dep:serde", "ems-core/serde"]
