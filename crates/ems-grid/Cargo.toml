[package]
name        = "ems-grid"
description = "German grid limits, metering and settlement rules for distributed energy systems"
keywords    = ["energy", "smart-grid", "enwg", "eebus", "compliance"]
categories  = ["science", "simulation"]
readme      = "README.md"
version.workspace      = true
authors.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
rust-version.workspace = true

[dependencies]
ems-core    = { workspace = true }
metering     = { workspace = true }
rust_decimal = { workspace = true }
serde        = { workspace = true, optional = true }
thiserror    = { workspace = true }
time         = { workspace = true }

[features]
default = ["serde"]
## Serialize/deserialize every public type.
serde = [
  "dep:serde",
  "ems-core/serde",
  "metering/serde",
  "rust_decimal/serde-with-str",
  "time/serde-well-known",
]

