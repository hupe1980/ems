[package]
name        = "ems-tariff"
description = "German retail electricity prices, network charges and feed-in remuneration by quarter hour"
keywords    = ["energy", "tariff", "enwg", "epex", "smart-grid"]
categories  = ["science", "finance"]
readme      = "README.md"
version.workspace      = true
authors.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
rust-version.workspace = true

[dependencies]
ems-core    = { workspace = true }
ems-grid    = { workspace = true }
quick-xml    = { workspace = true }
rust_decimal = { workspace = true }
serde_json   = { workspace = true }
serde        = { workspace = true, optional = true }
thiserror    = { workspace = true }
time         = { workspace = true }

[dev-dependencies]
rust_decimal_macros = "1"

[features]
default = ["serde"]
## Serialize/deserialize every public type.
serde = ["dep:serde", "ems-core/serde", "ems-grid/serde", "rust_decimal/serde-with-str"]
