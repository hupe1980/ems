# Include in nginx's http context. Only OAuth2 Proxy may reach this listener.
# Map keys must be case-sensitive, anchored regexes of exact subject IDs.
map $http_x_forwarded_user $household_authorization {
    default "";
    include /run/secrets/ems-household.map;
}
map $http_x_forwarded_user $operator_authorization {
    default "";
    include /run/secrets/ems-operator.map;
}
server {
    listen 127.0.0.1:4181;
    server_name _;
    proxy_set_header Cookie "";
    add_header Cache-Control "private, no-store" always;

    location ~ ^/(portal/?|assets/[^/]+|v1/me/(departure|history))$ {
        if ($household_authorization = "") { return 403; }
        proxy_set_header Authorization $household_authorization;
        proxy_set_header Cookie "";
        proxy_pass http://127.0.0.1:7680;
    }
    location ~ ^/(desk|v1/desk)$ {
        if ($operator_authorization = "") { return 403; }
        proxy_set_header Authorization $operator_authorization;
        proxy_set_header Cookie "";
        proxy_pass http://127.0.0.1:7180;
    }
    location / { return 404; }
}
