# Dependency policy for CI and scheduled advisory checks.

[graph]
all-features = true
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },  # the gateway box
    { triple = "aarch64-unknown-linux-musl" }, # the static build
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-apple-darwin" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MIT-0",
    "CC0-1.0",
    "0BSD",
    # Mozilla CA root data used by the PostgreSQL TLS client.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

# DataFusion enables Parquet compression through MeterStore.
[[licenses.exceptions]]
crate = "libbz2-rs-sys"
allow = ["bzip2-1.0.6"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

# Enforce aws-lc-rs for TLS. Other cryptographic uses of ring are permitted.
[[bans.features]]
crate  = "rustls"
deny   = ["ring"]
reason = "the TLS provider is aws-lc-rs; two rustls providers in one binary is a runtime panic"

[[bans.features]]
crate  = "rustls-webpki"
deny   = ["ring"]
reason = "the certificate verifier follows the same provider as rustls itself"

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Transitive maintenance notices in MeterStore's pinned DataFusion/Parquet stack.
    { id = "RUSTSEC-2026-0555", reason = "DataFusion enables Arrow timezone support. Revisit on the next MeterStore Arrow major." },
    { id = "RUSTSEC-2026-0542", reason = "DataFusion object_store uses humantime. Revisit when MeterStore updates object_store." },
    { id = "RUSTSEC-2024-0436", reason = "Parquet 58 uses paste at compile time. Revisit when MeterStore updates Parquet." },
    # Revisit when Arrow changes its time dependency.
    { id = "RUSTSEC-2026-0543", reason = "unmaintained, transitive via Apache Arrow under chronix; hems uses `time`" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
