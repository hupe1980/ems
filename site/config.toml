base_url = "https://hupe1980.github.io/ems"
title = "ems"
description = "Energy management for the German grid. Run a household gateway, replay building charging limits or reconcile industrial meter readings."
default_language = "en"
compile_sass = false
build_search_index = true

[link_checker]
# These URLs are served by the reader’s local demo processes.
skip_prefixes = ["http://127.0.0.1:8081/", "http://127.0.0.1:8082/", "http://127.0.0.1:8083/"]

[markdown]
smart_punctuation = true
insert_anchor_links = "heading"
github_alerts = true

[markdown.highlighting]
style = "class"
light_theme = "ayu-light"
dark_theme = "ayu-dark"

[search]
index_format = "elasticlunr_json"
include_title = true
include_description = true
include_path = true

[extra]
repository = "https://github.com/hupe1980/ems"
author     = "hupe1980"
doc_groups = ["Start", "Control and metering", "Integration and operations"]
tagline    = "open-source energy management for the German grid"

# check-stats verifies the citation, test and domain-crate counts.
stat_rules   = "465"
stat_tests   = "1472"
stat_crates  = "10"
stat_days    = "7"
stat_horizon = "192"
