{% set docs = get_section(path="docs/_index.md") %}
<nav class="docs-nav" aria-label="Documentation">
  {% include "partials/search.html" %}
  <p class="group-title"><a href="{{ docs.permalink }}"{% if here == docs.path %} aria-current="page"{% endif %}>Documentation</a></p>
  {% for g in config.extra.doc_groups %}
  <p class="nav-group">{{ g }}</p>
  <ol>
    {% for p in docs.pages %}{% if p.extra.group == g %}
    <li>
      <a href="{{ p.permalink }}"{% if here == p.path %} aria-current="page"{% endif %}>
        {{ p.title }}
      </a>
    </li>
    {% endif %}{% endfor %}
  </ol>
  {% endfor %}
</nav>
