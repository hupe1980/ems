<div class="search" id="search" role="search" aria-label="Documentation" hidden
     data-library="{{ get_url(path='elasticlunr.min.js') }}"
     data-index="{{ get_url(path='search_index.en.json') }}">
  <label class="skip" for="search-input">Search documentation</label>
  <input id="search-input" type="search" placeholder="Search documentation" autocomplete="off"
         spellcheck="false" aria-controls="search-results">
  <span id="search-status" class="skip" role="status"></span>
  <ul class="search-results" id="search-results"></ul>
</div>
