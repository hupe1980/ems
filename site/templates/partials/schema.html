{# Shared project and site identity. Templates can append page-specific JSON-LD nodes. #}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "SoftwareSourceCode",
      "@id": "{{ config.base_url }}/#project",
      "name": "{{ config.title }}",
      "description": {{ config.description | json_encode | safe }},
      "url": "{{ get_url(path='@/_index.md') }}",
      "image": "{{ get_url(path='og.png') }}",
      "codeRepository": "{{ config.extra.repository }}",
      "programmingLanguage": "Rust",
      "license": ["https://spdx.org/licenses/MIT.html", "https://spdx.org/licenses/Apache-2.0.html"],
      "author": { "@type": "Person", "name": "{{ config.extra.author }}", "url": "https://github.com/{{ config.extra.author }}" }
    },
    {
      "@type": "WebSite",
      "@id": "{{ config.base_url }}/#website",
      "url": "{{ get_url(path='@/_index.md') }}",
      "name": "{{ config.title }}",
      "description": {{ config.description | json_encode | safe }},
      "inLanguage": "en"
    }{{ extra | default(value="") | safe }}
  ]
}
</script>
