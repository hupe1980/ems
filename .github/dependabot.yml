# Every Action is pinned to a commit (cargo xtask check-actions), which freezes
# it — security fixes included. Dependabot is what moves a pin: a weekly pull
# request per Action, reviewed like any other dependency bump, rather than a tag
# that changes under a release without anyone seeing it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
