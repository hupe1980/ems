name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  CARGO_INCREMENTAL: 0

jobs:
  interfaces:
    uses: ./.github/workflows/interfaces.yml
    permissions:
      contents: read

  portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: pipx install uv==0.13.6
      - name: Exercise the customer portal, winter receipt and operator rehearsal
        run: |
          just portal-trial
          git diff --exit-code -- services/fleetd/src/api/assets
          just opcua-meter-trial
          just serial-meter-trial
          just heat-meter-trial
          just thermal-trial
          just canary-trial
        env:
          CHROME: /usr/bin/google-chrome

  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  purity:
    name: Domain crates stay pure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
      - run: just purity

  test:
    name: Tests
    runs-on: ubuntu-latest
    # Share one PostgreSQL instance across the fleet integration tests.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      EMS_TEST_POSTGRES: postgres://postgres:postgres@127.0.0.1:5432
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test --workspace --all-features

  features:
    name: Feature permutations
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        args:
          - --no-default-features
          - --all-features
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # `serde` is optional across the domain crates and it is easy to leave a
      # `#[cfg_attr]` behind that only compiles one way round.
      - run: cargo check --workspace ${{ matrix.args }}

  solvers:
    name: Solver backends
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [microlp, highs]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # HiGHS needs cmake and a C++ toolchain; microlp needs neither, which is
      # why it is the default and why both have to keep working.
      - run: cargo test -p ems-optimizer --no-default-features --features ${{ matrix.backend }},serde

  guards:
    name: Workspace guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # Every regulatory citation resolves to an indexed document, every
      # CloudEvents type is in the catalogue, and every crate's manifest names
      # files that exist. All of those failures are otherwise silent.
      - run: python3 -m unittest discover -s tools/conformance
      - run: python3 tools/conformance/contracts.py
      - run: cargo xtask check-all

  # Check resolution of the publishable crates as a workspace.
  publishable:
    name: Publishable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
      # Through `just` so the flags have one definition: `--no-verify` is the
      # whole difference between a four-second check and a forty-second one, and
      # two copies of that decision would drift.
      - run: just publishable

  demo:
    name: Simulated days
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # An example nobody runs rots. These are the product demonstration — and
      # the only check that has ever caught a rule module nobody calls.
      - run: cargo run -p hemsd -- simulate --day winter
      - name: Rehearse the first household day without history
        run: |
          cargo run --locked -p hemsd -- simulate --day winter --cold-start --json |
            jq -e '.history_days == 0 and .load_prior == "anchored" and .load_prior_share == 1'
      - run: cargo run -p hemsd -- simulate --day summer --json
      - run: cargo run -p hemsd -- simulate --day deadline
      - run: cargo run -p hemsd -- simulate --day shared
      - run: cargo run -p hemsd -- simulate --day offline
      - run: cargo run -p hemsd -- simulate --day autumn
      - run: cargo run -p hemsd -- simulate --day capped
      - run: cargo run -p hemsd -- simulate --day capped --imsys
      # § 42c: the day the community term has a caller. A rule module nobody
      # invokes is not a feature, and no property test catches one.
      - run: cargo run -p hemsd -- simulate --day winter --sharing
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Exercise the three edge pages in Chrome
        env:
          CHROME: /usr/bin/google-chrome
        run: |
          cargo build --locked -p hemsd -p bemsd -p cemsd --features cemsd/opcua
          target/debug/hemsd demo --days 1 &
          home_pid=$!
          target/debug/bemsd demo &
          building_pid=$!
          target/debug/cemsd demo &
          industrial_pid=$!
          trap 'kill "$home_pid" "$building_pid" "$industrial_pid" 2>/dev/null || true' EXIT
          node xtask/media.mjs release-preview

      - name: Check offline industrial interval review in Chrome
        env:
          CHROME: /usr/bin/google-chrome
        run: pipx run --spec uv==0.13.6 uv run xtask/interval_review.py

      - name: Exercise the optional OpenADR request and withdrawal
        run: |
          cargo run --locked -p cemsd --features openadr -- openadr --json > "$RUNNER_TEMP/request.json"
          cargo run --locked -p cemsd --features openadr -- openadr --cancel-before-dispatch --json > "$RUNNER_TEMP/withdrawn.json"
          jq -e '.simulated and .requested_mean_kw == 1100 and .projected_early_mean_kw == 1100 and .projected_delayed_mean_kw == 1116 and .reported_meter_kwh == 285 and .original_meter_mean_kw == 1140' "$RUNNER_TEMP/request.json"
          jq -e '.cancelled_before_dispatch and .requested_mean_kw == null and .projected_early_mean_kw == null and .projected_delayed_mean_kw == null and .reported_meter_kwh == null' "$RUNNER_TEMP/withdrawn.json"

      - name: Verify building replay at the meter deadline
        run: pipx run --spec uv==0.13.6 uv run --python 3.13 xtask/building_replay.py target/debug/bemsd
        env:
          CHROME: /usr/bin/google-chrome

      - name: Verify member and coordinator views in separate browser sessions
        run: pipx run --spec uv==0.13.6 uv run --python 3.13 xtask/community_replay.py target/debug/bemsd
        env:
          CHROME: /usr/bin/google-chrome

      - name: Verify household history inspection and export
        run: pipx run --spec uv==0.13.6 uv run --python 3.13 xtask/history_browser.py
        env:
          CHROME: /usr/bin/google-chrome

      - name: Verify reduction notifications and tap destinations
        run: pipx run --spec uv==0.13.6 uv run --python 3.13 xtask/notification_browser.py
        env:
          CHROME: /usr/bin/google-chrome

  house:
    name: Virtual house
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # The box against far ends it did not write: a third-party Modbus server
      # and an EEBUS Energy Guard, over real sockets, in real time. Its own job
      # so a protocol failure is not one line among a thousand tests.
      - run: cargo test -p hemsd --features house --test managed_by_a_cem a_manager_reads_the_virtual_house_battery_over_wss
      - run: cargo test -p hemsd --features house --test virtual_house
      - run: cargo test -p hemsd --features house --lib matched_socket_costs_on_every_reference_day
      - run: cargo test --locked -p hemsd --features house --lib signed_battery_power_reverts_on_the_wire
      - run: cargo test --locked -p hemsd --features house --lib departure_is_closed
      - run: cargo test --locked -p hemsd --features house --lib gateway_storage_trial
      - run: cargo test --locked -p hemsd --features house --lib berlin_meter_days_reconcile_on_the_wire -- --nocapture
      - run: cargo test --locked -p hemsd --features house --lib a_winter_departure_is_visible_on_the_occupied_house_meter -- --nocapture
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: flexiblepower/s2-analyzer
          ref: 1a37ba6db52394bc02cad79be7226e78b8b60719
          path: .s2-analyzer
          persist-credentials: false
      - name: Inspect managed battery loss and recovery at mobile width
        run: pipx run --spec uv==0.13.6 uv run --python 3.13 xtask/storage_control.py target/debug/hemsd
        env:
          CHROME: /usr/bin/google-chrome
      - name: Validate the live battery with S2 Analyzer
        run: |
          pipx run --spec uv==0.13.6 uv run --project .s2-analyzer/backend --frozen --no-dev --python 3.12 \
            env PYTHONPATH="$PWD/.s2-analyzer/backend" python xtask/s2_analyzer.py target/debug/hemsd
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: python3 xtask/doctor.py target/debug/hemsd
        env:
          CHROME: /usr/bin/google-chrome
      - run: python3 xtask/commissioning.py target/debug/hemsd
        env:
          CHROME: /usr/bin/google-chrome
      - name: Verify appliance readings through peer loss and gateway restart
        run: |
          cargo build --locked -p hemsd --features house,matter
          pipx run --spec uv==0.13.6 uv run --python 3.13 xtask/matter_recovery.py target/debug/hemsd
      # And the box's ordinary build does not carry the simulator's server.
      - run: "! cargo tree -p hemsd -e normal | grep -q tokio-modbus"

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo doc --workspace --no-deps --all-features

  msrv:
    name: Minimum supported Rust version (1.99)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo check --workspace --all-features

  deny:
    name: Licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2
        with:
          command: check

  home-assistant:
    name: Home Assistant webhook example
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Load the documented automation and check its notification
        run: |
          docker run --rm --entrypoint python \
            -v "$PWD/xtask/home_assistant.py:/test.py:ro" \
            -v "$PWD/site/content/docs/api.md:/api.md:ro" \
            ghcr.io/home-assistant/home-assistant@sha256:493a07e8f6530fc640223f4a0a5248f20a61ca2f718bb1d31efbf08a2c5ea28f \
            /test.py /api.md
