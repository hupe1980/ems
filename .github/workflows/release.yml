name: Release

# A version tag publishes the verified artifacts. Manual runs exercise packaging.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  # A manual run builds, packages and smoke-tests everything and publishes
  # nothing: the two publishing jobs are gated on the trigger being a tag. That
  # is the dry run, and it needs no flag anybody could forget to set.
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  # Never cancel: a half-finished publish is worse than a queued one.
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Tag matches the workspace version
        id: version
        run: |
          set -euo pipefail
          manifest="$(sed -n '/^\[workspace\.package\]/,/^\[/p' Cargo.toml \
            | sed -n 's/^version *= *"\(.*\)"/\1/p' | head -1)"
          echo "version=$manifest" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$manifest" ]; then
              echo "::error::tag v$tag does not match [workspace.package] version $manifest"
              exit 1
            fi
          fi
          echo "releasing $manifest"

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with:
          tool: cargo-deny

      - name: Verify the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          runs="repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs"
          if [[ "$(gh api --method GET "$runs" -f branch=main -f event=push -f head_sha="$sha" -F per_page=1 \
                    --jq '.workflow_runs[0].conclusion')" == success ]]; then
            echo "CI passed for $sha on main."
          else
            just ci
          fi
      - name: Exercise household release simulations
        env:
          CHROME: /usr/bin/google-chrome
        run: |
          pipx install uv==0.13.6
          just quote-trial
          just retained-history-trial

  # Build natively on each Linux architecture for the HiGHS C++ dependency.
  binaries:
    name: Edge daemons (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake

      # Embed the dependency tree in each executable.
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with:
          tool: cargo-auditable

      - run: cargo auditable build --release --locked -p hemsd -p bemsd -p cemsd

      - name: Smoke test
        run: |
          ./target/release/bemsd --version
          ./target/release/cemsd reconcile crates/ems-sim/fixtures/shift-trace.json
          ./target/release/hemsd simulate --day winter
          ./target/release/hemsd simulate --day shared --json > /dev/null

      - name: Package
        run: |
          set -euo pipefail
          for daemon in hemsd bemsd cemsd; do
            name="$daemon-${{ needs.verify.outputs.version }}-${{ matrix.target }}"
            mkdir -p "dist/$name"
            cp "target/release/$daemon" LICENSE-MIT LICENSE-APACHE "services/$daemon/README.md" "dist/$name/"
            if [[ "$daemon" == hemsd ]]; then
              cp services/hemsd/{hemsd.example.toml,openapi.json} "dist/$name/"
            elif [[ "$daemon" == bemsd ]]; then
              cp -R services/bemsd/examples "dist/$name/"
            else
              mkdir "dist/$name/examples"
              cp crates/ems-sim/fixtures/shift-trace.json "dist/$name/examples/"
              "dist/$name/cemsd" reconcile "dist/$name/examples/shift-trace.json"
            fi
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: edge-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  sbom:
    name: SBOM
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo install --locked cargo-cyclonedx
      - name: Generate a CycloneDX inventory for each daemon
        run: |
          set -euo pipefail
          mkdir -p sbom
          cargo cyclonedx --manifest-path Cargo.toml --format json
          for daemon in hemsd bemsd cemsd; do
            inventory="services/$daemon/$daemon.cdx.json"
            jq -e --arg daemon "$daemon" '.metadata.component.name == $daemon and any(.components[]; .name == "ems-service")' "$inventory"
            cp "$inventory" "sbom/$daemon-${{ needs.verify.outputs.version }}.cdx.json"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom/*.json
          if-no-files-found: error

  # ── 4. The GitHub release ───────────────────────────────────────────────────
  release:
    name: GitHub release
    needs: [verify, binaries, sbom]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance: a signed statement, in a public transparency log, that
      # these artefacts came out of this workflow at this commit. It is what lets
      # somebody who downloaded a tarball check that it is the one we built.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum ./*.tar.gz ./*.json > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: artifacts/*.tar.gz

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: ems ${{ needs.verify.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.json
            artifacts/SHA256SUMS

  # Publish in dependency order after the binary release succeeds.
  crates-io:
    name: Publish to crates.io
    needs: [release]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Named so crates.io's trusted publishing can be scoped to it, and so a
    # required reviewer can be added later without touching this file.
    environment: crates-io
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1
        id: auth

      # Re-running after a partial publish skips versions already on the registry.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -uo pipefail
          for crate in ems-core ems-events ems-service ems-device \
                       ems-forecast ems-grid ems-sim ems-drv ems-flex \
                       ems-realtime ems-tariff ems-optimizer; do
            echo "::group::$crate"
            out=$(cargo publish -p "$crate" --locked 2>&1) && rc=0 || rc=$?
            echo "$out"
            echo "::endgroup::"
            if [ "$rc" -ne 0 ] \
               && ! echo "$out" | grep -qE "already uploaded|already exists on crates\.io"; then
              exit "$rc"
            fi
          done
