name: Site

on:
  pull_request:
    paths: ["site/**", "crates/ems-sim/**", "crates/ems-core/**", "crates/ems-device/**", "tools/ems-wasm/**", "xtask/check_site.py", "xtask/peak_challenge.py", "Cargo.*", "justfile", "rust-toolchain.toml", ".github/workflows/site.yml"]
  push:
    branches: [main]
    paths: ["site/**", "crates/ems-sim/**", "crates/ems-core/**", "crates/ems-device/**", "tools/ems-wasm/**", "xtask/check_site.py", "xtask/peak_challenge.py", "Cargo.*", "justfile", "rust-toolchain.toml", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with:
          tool: zola@0.23.4,just@1.59.0
      - run: just site-build
      - name: Exercise the household and industrial simulations in Chrome
        run: pipx run --spec uv==0.13.6 uv run --python 3.13 xtask/peak_challenge.py
        env:
          CHROME: /usr/bin/google-chrome
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site/public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
